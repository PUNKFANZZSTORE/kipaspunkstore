<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNK FANZ! — Stay Weird, Stay Cool</title>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #09090b;
            --green: #c6ff00;
            --pink: #ff3cac;
            --red: #ff3448;
            --purple: #9b5cff;
            --white: #f8f7f2;
        }

        body {
            margin: 0;
            background: var(--black);
            color: var(--white);
            font-family: 'Poppins', sans-serif;
        }

        header {
            padding: 20px 5%;
            border-bottom: 2px solid var(--green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Anton', sans-serif;
            font-size: 32px;
            color: var(--green);
            text-shadow: 3px 3px var(--pink);
        }

        .hero {
            text-align: center;
            padding: 90px 20px;
        }

        .hero h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(45px, 8vw, 90px);
            line-height: 1;
        }

        .hero h1 span {
            color: var(--green);
        }

        .btn {
            display: inline-block;
            padding: 14px 25px;
            background: var(--green);
            color: var(--black);
            text-decoration: none;
            font-weight: bold;
            border: 2px solid var(--pink);
            cursor: pointer;
        }

        .btn:hover {
            background: var(--pink);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">PUNK FANZ!</div>
        <a href="#shop" class="btn">SHOP NOW</a>
    </header>

    <section class="hero">
        <h1>
            BE COOL.<br>
            <span>STAY WEIRD.</span><br>
            GO PUNK!
        </h1>

        <p>Portable fans for your chaotic little world.</p>

        <a href="#shop" class="btn">BELANJA SEKARANG ⚡</a>
    </section>

    <!-- Bagian produk dan JavaScript lengkap ada di file download -->
</body>
</html>
